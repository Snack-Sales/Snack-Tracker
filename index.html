<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snack Stock Tracker</title>
<style>
  body { font-family: Arial; max-width: 600px; margin: 20px auto; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
  th, td { border: 1px solid #333; padding: 8px; text-align: center; }
  #login-section, #main-section { margin-bottom: 20px; }
  #main-section { display: none; }
  #stock-editor { display: none; margin-bottom: 20px; border: 1px solid #ccc; padding: 10px; }
</style>
</head>
<body>

<h1>Snack Stock Tracker</h1>

<div id="login-section">
  <label>Enter Website Password: </label>
  <input type="password" id="website-password-input">
  <button id="website-password-submit">Submit</button>
</div>

<div id="main-section">
  <div>
    <label>Enter Stock Passcode: </label>
    <input type="password" id="passcode-input">
    <button id="passcode-submit">Submit</button>
  </div>

  <div id="stock-editor">
    <h3>Edit Stock</h3>
    <label>Item:</label>
    <select id="edit-item-select"></select>
    <label>New Quantity:</label>
    <input type="number" id="edit-quantity" min="0">
    <button id="update-stock">Update Stock</button>
  </div>

  <table id="stock-table">
    <tr>
      <th>Item</th>
      <th>Price</th>
      <th>Remaining Stock</th>
    </tr>
  </table>

  <h2>Log a Sale</h2>
  <form id="sale-form">
    <label>Item:</label>
    <select id="item-select"></select>
    <label>Quantity:</label>
    <input type="number" id="quantity" min="1" required>
    <button type="submit">Submit Sale</button>
  </form>
</div>

<script>
let stock = [
  {name: "Welch’s Fruit Snacks", price: 2, qty: 40},
  {name: "Rice Krispies Treats", price: 2, qty: 40},
  {name: "Takis", price: 2, qty: 25}
];

const WEBSITE_PASSWORD = "Gators25"; // Updated website password
const STOCK_PASSCODE = "187350";
let accessGranted = false;

const loginSection = document.getElementById('login-section');
const mainSection = document.getElementById('main-section');
const saleForm = document.getElementById('sale-form');
saleForm.style.display = 'none'; // hidden until stock passcode is correct

function updateTables() {
  const table = document.getElementById('stock-table');
  const select = document.getElementById('item-select');
  const editSelect = document.getElementById('edit-item-select');

  table.innerHTML = '<tr><th>Item</th><th>Price</th><th>Remaining Stock</th></tr>';
  select.innerHTML = '';
  editSelect.innerHTML = '';

  stock.forEach(item => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${item.name}</td><td>$${item.price}</td><td>${item.qty}</td>`;
    table.appendChild(tr);

    const option1 = document.createElement('option');
    option1.value = item.name;
    option1.textContent = item.name;
    select.appendChild(option1);

    const option2 = document.createElement('option');
    option2.value = item.name;
    option2.textContent = item.name;
    editSelect.appendChild(option2);
  });
}

// Website login
document.getElementById('website-password-submit').addEventListener('click', () => {
  const code = document.getElementById('website-password-input').value;
  if (code === WEBSITE_PASSWORD) {
    loginSection.style.display = 'none';
    mainSection.style.display = 'block';
    alert("Welcome! You can now enter the stock passcode.");
  } else {
    alert("Incorrect website password!");
  }
});

// Stock passcode check
document.getElementById('passcode-submit').addEventListener('click', () => {
  const code = document.getElementById('passcode-input').value;
  if (code === STOCK_PASSCODE) {
    accessGranted = true;
    document.getElementById('stock-editor').style.display = 'block';
    saleForm.style.display = 'block';
    alert("Stock access granted. You can now edit stock and log sales.");
  } else {
    alert("Incorrect stock passcode!");
  }
});

// Update stock
document.getElementById('update-stock').addEventListener('click', () => {
  if (!accessGranted) return;
  const itemName = document.getElementById('edit-item-select').value;
  const newQty = parseInt(document.getElementById('edit-quantity').value);
  if (!isNaN(newQty) && newQty >= 0) {
    const item = stock.find(i => i.name === itemName);
    item.qty = newQty;
    updateTables();
    alert(`${itemName} stock updated to ${newQty}`);
  } else {
    alert("Invalid quantity!");
  }
  document.getElementById('edit-quantity').value = '';
});

// Sale form
saleForm.addEventListener('submit', e => {
  e.preventDefault();
  if (!accessGranted) return;

  const itemName = document.getElementById('item-select').value;
  const qty = parseInt(document.getElementById('quantity').value);
  const item = stock.find(i => i.name === itemName);
  if (item && qty <= item.qty) {
    item.qty -= qty;
    updateTables();
    alert(`Sale recorded: ${qty} ${itemName}`);
  } else {
    alert("Not enough stock!");
  }
  document.getElementById('quantity').value = '';
});

updateTables();
</script>

</body>
</html>
